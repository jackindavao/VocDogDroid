<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244d3f">
  <title>VocDog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icon.svg" alt=""><span>VocDog</span></div>
    <div class="toolbar" aria-label="Deck controls">
      <button id="openButton" class="primary">Open TSV</button>
      <button id="startButton" disabled>Start</button>
      <button id="stopButton" disabled>Stop</button>
      <button id="resetButton" disabled>Reset</button>
      <button id="swapButton" disabled>Swap Q/A</button>
      <button id="rangeButton" disabled>Range</button>
      <button id="fieldsButton" disabled>Fields</button>
      <button id="randomButton" disabled>Randomize</button>
      <button id="viewButton" disabled>View All</button>
    </div>
    <input id="fileInput" type="file" accept=".tsv,.txt,text/tab-separated-values,text/plain" hidden>
  </header>

  <main>
    <section class="card" aria-live="polite">
      <label for="promptInput">Prompt</label>
      <textarea id="promptInput" class="prompt" rows="2" disabled>Open a TSV file to begin</textarea>
      <label for="answerInput">Answer</label>
      <textarea id="answerInput" class="answer" rows="2" disabled></textarea>
      <div id="details" class="details"></div>
    </section>

    <section id="actions" class="actions" aria-label="Practice response">
      <button id="revealButton" class="reveal" disabled>Reveal answer</button>
      <div id="ratingActions" hidden>
        <div class="rating-grid" aria-label="Schedule item">
          <button data-rating="1">1</button><button data-rating="2">2</button>
          <button data-rating="3">3</button><button data-rating="4">4</button>
          <button data-rating="5">5</button><button data-rating="6">6</button>
          <button data-rating="7">7</button><button data-rating="8">8</button>
          <button data-rating="9">9</button>
        </div>
        <div class="decision-row">
          <button id="ejectButton" class="danger">0 · Learned</button>
          <button id="endButton" class="primary">Move to end</button>
        </div>
        <p class="hint">1 = soon · 9 = late · 0 = remove from this cycle</p>
      </div>
    </section>
  </main>

  <footer id="status">No deck loaded</footer>

  <dialog id="rangeDialog">
    <form method="dialog" id="rangeForm">
      <h2>Practice range</h2>
      <p id="rangeHelp"></p>
      <label>Start item <input id="rangeStart" type="number" min="1" required></label>
      <label>End item <input id="rangeEnd" type="number" min="1" required></label>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button id="rangeAll" type="button">Entire deck</button><button value="default" class="primary">Apply</button></div>
    </form>
  </dialog>

  <dialog id="fieldsDialog">
    <form method="dialog" id="fieldsForm">
      <h2>Practice fields</h2>
      <label>Prompt <select id="promptSelect"></select></label>
      <label>Answer <select id="answerSelect"></select></label>
      <button id="dialogSwap" type="button">Swap prompt and answer</button>
      <fieldset><legend>Additional fields</legend><div id="detailsChoices"></div></fieldset>
      <p id="fieldsError" class="error"></p>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button value="default" class="primary">Apply</button></div>
    </form>
  </dialog>

  <dialog id="viewDialog" class="wide-dialog">
    <form method="dialog">
      <h2>All vocabulary items</h2>
      <p id="viewHeading"></p>
      <pre id="allItems"></pre>
      <div class="dialog-actions"><button value="default" class="primary">Close</button></div>
    </form>
  </dialog>

  <script type="module" src="app.mjs"></script>
</body>
</html>
